[package]
name = "editor-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prisma self-hosted editor ('editor as a game') built on prism-app, prism-engine, and prism-ui"

[dependencies]
prism-ui = { path = "../prism-ui", features = ["ui-tween", "ui-blur", "ui-effects", "ui-desktop"] }
prism-app = { path = "../../../../crates/prism-app", default-features = false, features = [
    "winit-backend",
    "x11",
    "wayland",
    "ui",
    "ui-fontdue",
    "ibl",
    "shadows",
    "group-3d",
    "group-2d",
    "group-ui",
] }
prism-engine = { path = "../../../../crates/prism-engine", default-features = false, features = [
    "ui",
    "ui-fontdue",
    "ibl",
    "skybox",
    "shadows",
    "group-3d",
    "group-2d",
    "group-ui",
] }
prism-editor-api = { path = "../../../../crates/prism-editor-api" }
glam = { workspace = true }
log = { workspace = true }
serde_json = "1"
