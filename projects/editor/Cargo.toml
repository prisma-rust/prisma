[workspace]
resolver = "2"
members = [
    "crates/prism-ui",
    "crates/editor-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.33.2", features = ["serde"] }
slotmap = "1.0"
log = "0.4"
# The engine's UI draw packet: prism-ui builds it directly so the bridge has
# nothing to translate, and prism-render consumes it untouched.
prism-ui-draw = { path = "../../crates/prism-ui-draw" }
# 与根 workspace 一致：ash/Vulkan 代码量巨大，opt-level=1 让 debug 构建可用。
# 缺这一段时依赖全部按 opt-level=0 编译——字体解析会从 ~220ms 涨到 ~1.5s。
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
