[package]
name = "fishing"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Cozy Fishing — 2D pixel fishing game (user project)"

# Independent workspace (same structure as projects/template), not attached to root Prisma workspace.

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "fishing"
path = "src/main.rs"
# Player binary only built in `player` form: `preview-module` build should not link engine.
required-features = ["player"]

# Two forms (same structure as `projects/template`):
# - `player` (default): static player, links engine, produces desktop binary + Android cdylib.
# - `preview-module`: dynamic module loaded by editor Play, only depends on pure data layer across ABI.
[features]
default = ["player"]
player = ["dep:prism-app", "dep:prism-engine", "prism-game-api/host", "prism-app/audio"]
# Component schema must match editor host **exactly**: host compiles with prism-scene default groups,
# module is independent workspace without engine feature unification, so here explicitly enable three groups.
# Missing any group, `ProjectModule::load` schema fingerprint check will reject module,
# and project itself cannot encode SpriteRenderer-like components.
preview-module = [
    "dep:prism-project-api",
        # Without `plugin` backend `prism-game-api` `Backend` is empty enum (won't compile).
    "prism-game-api/plugin",
    "prism-scene/group-3d",
    "prism-scene/group-2d",
    "prism-scene/group-ui",
]

[dependencies]
prism-app = { path = "../../../crates/prism-app", optional = true }
prism-engine = { path = "../../../crates/prism-engine", optional = true }
# Plugin form only needs `plugin` backend: default `host` would pull in prism-engine.
prism-game-api = { path = "../../../crates/prism-game-api", default-features = false }
prism-project-api = { path = "../../../crates/prism-project-api", optional = true }
prism-scene = { path = "../../../crates/prism-scene", default-features = false }
log = "0.4"
glam = "0.33.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Tests only need a pure data ECS (no Vulkan / no engine): `GameWorld::host` borrows
# it, gameplay regression tests use it instead of editor host.
[dev-dependencies]
prism-ecs = { path = "../../../crates/prism-ecs" }
prism-game-api = { path = "../../../crates/prism-game-api", features = ["host"] }

# Player / Android packaging: volume priority (fat LTO + single codegen unit + abort + strip).
# Editor / tools run inside engine process, cannot use this profile.
