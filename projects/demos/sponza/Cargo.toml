[package]
name = "sponza"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Sponza path-tracing & SHaRC sample project"


[lib]
# The bin is `sponza` too; a matching lib name made both targets write
# `sponza.pdb` (Windows link error / PDB conflict). The lib crate is
# `sponza_core`, the executable stays `sponza`.
name = "sponza_core"
crate-type = ["lib"]

[[bin]]
name = "sponza"
path = "src/main.rs"
required-features = ["player"]

[features]
default = ["player", "sharc"]
# Only responsible for "linking the engine", **not** deciding rendering capability: capability switches are written in own features,
# otherwise `--no-default-features --features player` would silently bring capabilities back.
player = [
    "dep:prism-app",
    "dep:prism-engine",
    "prism-game-api/host",
        # Engine bricks listed one by one, consistent with `projects/template` `player-core`:
        # Both dependencies below write `default-features = false`; omitting it means nothing gets compiled.
    "prism-app/pathtrace",
    "prism-app/ui",
    "prism-app/ui-fontdue",
    "prism-app/ibl",
    "prism-app/shadows",
    "prism-app/gtao",
    "prism-app/winit-backend",
    "prism-app/x11",
    "prism-app/wayland",
    "prism-app/group-3d",
    "prism-app/group-2d",
    "prism-app/group-ui",
    "prism-engine/pathtrace",
    "prism-engine/ui",
    "prism-engine/ui-fontdue",
    "prism-engine/ibl",
    "prism-engine/skybox",
    "prism-engine/shadows",
    "prism-engine/gtao",
    "prism-engine/group-3d",
    "prism-engine/group-2d",
    "prism-engine/group-ui",
]
preview-module = [
    "dep:prism-project-api",
    "prism-game-api/plugin",
    "prism-scene/group-3d",
    "prism-scene/group-2d",
    "prism-scene/group-ui",
]
# NVIDIA RTXGI SHaRC (world-space radiance cache). **Enabled by default**: Sponza default render path is
# path tracing + SHaRC. Turning it off falls back to pure path tracing:
#   cargo run --no-default-features --features player
sharc = ["prism-app/sharc", "prism-engine/sharc"]
nrc = ["prism-app/nrc", "prism-engine/nrc"]
dlss = ["prism-app/dlss", "prism-engine/dlss"]

[dependencies]
# Both dependencies disable default features: capabilities are explicitly listed by above `player` / `sharc`.
# With default features on, Cargo "can only add not remove" would make `--no-default-features --features player`
# still bring `sharc` back, making switches meaningless.
prism-app = { path = "../../../crates/prism-app", optional = true, default-features = false }
prism-engine = { path = "../../../crates/prism-engine", optional = true, default-features = false }
prism-game-api = { path = "../../../crates/prism-game-api", default-features = false }
prism-project-api = { path = "../../../crates/prism-project-api", optional = true }
prism-platform = { path = "../../../crates/prism-platform" }
prism-scene = { path = "../../../crates/prism-scene", default-features = false }
log = "0.4"
