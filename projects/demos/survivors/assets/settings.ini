[app]
company = "Prisma"
name = "survivors"
version = "0.1.0"

[window]
title = "Potato Survivors"
width = 1280
height = 720
resizable = true
fullscreen = false
vsync = true

[build]
lib_name = survivors_core
target = "windows"
profile = "release"
output_dir = "build/windows"
run_after = false

[render]
render_mode = "sprites_2d"
tonemap_mode = 2
