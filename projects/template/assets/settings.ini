; Prisma project config (INI dialect see docs/DESIGN.md §"Project config file").
; Note: no inline comment parsing; empty/bad values fall back to defaults and warn.

[app]
company = "Excurs1ons"
name = "Prisma"
version = "0.1.0"

[build]
; lib_name: Android .so name (`lib<lib_name>.so` and `android.app.lib_name`).
; Only used by packaging scripts; when absent inferred from Cargo.toml lib name (#598).
lib_name = template_core
output_dir = "build/windows"
profile = "release"
run_after = false
target = "windows"

[render]
; internal_resolution: internal render resolution (#613). off / empty = render at window resolution;
; e.g. 640x360 renders scene at that size then upscales to window (UI still at window size).
internal_resolution = off
; internal_scale_mode: stretch = fill window; integer = max integer multiple + centered black bars.
internal_scale_mode = stretch
; aa_mode: 0 = off (default), 1 = FXAA post-process antialiasing.
aa_mode = 0
; contrast / saturation / vignette: post-processing color grading (#502).
; contrast = 1.0 unchanged; saturation = 1.0 unchanged (0 = grayscale); vignette = 0.0 off (1 = corners fully black).
contrast = 1.0
saturation = 1.0
vignette = 0.0
bloom = false
bloom_intensity = 0.15
bloom_threshold = 1.0
; chromatic_aberration: lens chromatic aberration strength (#502 Phase 2); 0 = off, 1 = strongest.
chromatic_aberration = 0.0
; film_grain: film grain strength (#502 Phase 2); 0 = off, 1 = strongest.
film_grain = 0.0
; temperature / tint: white balance (#502); -1..1, 0 = neutral.
; temperature < 0 cooler (blue), > 0 warmer (orange); tint < 0 greener, > 0 more magenta.
temperature = 0.0
tint = 0.0
; dof_focus_distance / dof_aperture / dof_max_blur: depth of field (#502 Phase 2).
; aperture = 0 off; focus distance in meters; max_blur is max blur radius (pixels).
dof_focus_distance = 1.0
dof_aperture = 0.0
dof_max_blur = 8.0
; lut / lut_strength: 3D color grading LUT (#502), path relative to assets/, supports .cube files.
; Empty = unused; strength 0 = off, 1 = full (identity LUT +1 same as disabled).
lut =
lut_strength = 0.0
; motion_blur / motion_blur_max_pixels: camera motion blur (#502 Phase 2).
; motion_blur = 0 off; max_pixels limits trail length to prevent fast camera turns filling screen.
motion_blur = 0.0
motion_blur_max_pixels = 16.0
; taa / taa_strength: temporal antialiasing (#883). Off by default; when on camera does subpixel jitter,
; uses previous-frame history and depth reprojection; strength is history weight (0–0.95).
taa = false
taa_strength = 0.9
; shadow_distance: main directional light shadow coverage distance (meters, #526).
; Box centered at half distance in front of camera, edge = this value; at 2048² map 60 m ≈ 2.9 cm/texel.
; No cascades, so this is a tradeoff between "how far shadows reach" and "precision".
shadow_distance = 60.0
; shadow_cascade_count: 1 = single shadow map (default), 2 = near/far 2-cascade atlas (#526).
shadow_cascade_count = 1
debug_flags = 0
debug_rt = 0
; wireframe: true = forward pipeline draws mesh in wireframe (#431); auto falls back to fill if unsupported.
wireframe = false
; shaded_wireframe: true = normal fill + wireframe overlay (#431); if wireframe true, pure wireframe takes precedence.
shaded_wireframe = false
pt_max_bounces = 3
pt_max_iterations = 0
pt_ray_max_distance = 1000.0
render_mode = "raster"
tonemap_mode = 0

[window]
fullscreen = false
height = 900
resizable = true
title = "Prisma"
vsync = true
width = 1600
