[package]
name = "template"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Prisma user game project (template) — desktop binary `template`, spawned by launcher/"

# Independent workspace (following launcher/ example), not attached to root Prisma workspace.
[workspace]

# Desktop binary is `template`; Android / editor use same cdylib, but **lib name separate**
# `template_core` — when lib and bin share name they compete for same `template.pdb` (MSVC reports conflict),
# and sharing target dir would overwrite each other outputs. `android.app.lib_name` (launcher gen/android
# Manifest) must equal `[build] lib_name` / lib name here.
# `lib` type for desktop bin to link rlib; Android GameActivity entry and editor-loaded
# preview module pass `--crate-type cdylib` via `cargo rustc` on demand.
[lib]
name = "template_core"
crate-type = ["lib"]

# Two build forms, mutually exclusive:
# - `player` (default): static Player / Android, links engine directly.
# - `preview-module`: cdylib loaded by editor. **Does not link engine**, only depends on cross-ABI
#   `prism-game-api` / `prism-project-api`, otherwise .so would carry a second engine.
[features]
default = ["player", "winit-window"]
# Engine / render capabilities (`player-core`) separated from **window backend** and **text rasterizer backend**,
# so release build can keep only one window backend and one text backend.
#
# Text backend split out of `player-core`: `fontdue` (all platforms) and system `DirectWrite` (Windows only)
# are mutually exclusive in `prism-render`, putting them in `player` would prevent project choosing DirectWrite.
player-core = [
    "dep:prism-app",
    "dep:prism-engine",
        # `prism-game-api` default enables `host` (borrows host World), pulls in
        # `prism-engine`; preview-module can only have `plugin` backend, otherwise .so carries
        # second engine. Host explicitly enabled only in static Player combo.
    "prism-game-api/host",
    "prism-app/pathtrace",
        # Engine default already includes `sharc` (SHaRC); template disabled prism-app / prism-engine defaults,
        # must add back explicitly here, otherwise template player misses an engine default capability.
    "prism-app/sharc",
    "prism-engine/sharc",
        # Engine debug layer (F3 HUD / Tab debug graph / T tone map / number keys PBR isolation) **default off**,
        # template explicitly enables: new project should see frame time, switch debug graph. Remove these two lines if not needed.
    "prism-app/engine-debug",
    "prism-engine/engine-debug",
    "prism-app/ui",
    "prism-app/ibl",
    "prism-app/shadows",
    "prism-app/gtao",
    "prism-app/group-3d",
    "prism-app/group-2d",
    "prism-app/group-ui",
    "prism-engine/pathtrace",
    "prism-engine/ui",
    "prism-engine/ibl",
    "prism-engine/skybox",
    "prism-engine/shadows",
    "prism-engine/gtao",
    "prism-engine/group-3d",
    "prism-engine/group-2d",
    "prism-engine/group-ui",
]
# Full default combo that "can produce player binary" = capabilities + fontdue text backend.
# For Windows system text use `player-core,ui-directwrite` (see below).
player = ["player-core", "ui-fontdue"]
# Text backend A: fontdue + ttf-parser (all platforms, default).
ui-fontdue = ["prism-app/ui-fontdue", "prism-engine/ui-fontdue"]
# Text backend B: Windows system DirectWrite (drops fontdue/ttf-parser, ~60 KiB).
# Usage: `cargo build --release --no-default-features --features ui-directwrite,win32-window`
ui-directwrite = [
    "player-core",
    "prism-app/ui-directwrite",
    "prism-engine/ui-directwrite",
]
# winit backend for desktop / Android (default).
winit-window = ["prism-app/winit-backend", "prism-app/x11", "prism-app/wayland"]
# Windows release build: Win32 native window, **no winit** (saves ~300 KB).
# Usage: `cargo build --release --no-default-features --features player,win32-window`
win32-window = ["prism-app/win32-native"]
# Component schema must match editor host **exactly**: host compiles with default groups,
# module is independent workspace without engine feature unification, so here explicitly enables
# three groups. Missing any group, `ProjectModule::load` schema fingerprint check
# rejects module (and project itself cannot encode Style / SpriteRenderer etc).
preview-module = [
    "dep:prism-project-api",
    "prism-scene/group-3d",
    "prism-scene/group-2d",
    "prism-scene/group-ui",
]

[[bin]]
name = "template"
path = "src/main.rs"
# Without `player-core` there is no `build_app`, so bin should not be built either.
required-features = ["player-core"]

[dependencies]
# `default-features = false`: window backend explicitly selected by this crate `winit-window` /
# `win32-window` (Cargo features can only add not remove, so cannot use default here).
prism-app = { path = "../../crates/prism-app", optional = true, default-features = false }
# Must default-features = false: text backend explicitly selected by ui-fontdue / ui-directwrite
# here (Cargo features can only add not remove, otherwise fontdue always in binary).
prism-engine = { path = "../../crates/prism-engine", optional = true, default-features = false }
prism-game-api = { path = "../../crates/prism-game-api", default-features = false, features = [
    "plugin",
] }
prism-project-api = { path = "../../crates/prism-project-api", optional = true }
# Pure data layer (component / UI schema), needed by both forms.
prism-scene = { path = "../../crates/prism-scene", default-features = false }
keyframe = "1.1"
log = "0.4"

[build-dependencies]
prism-ini = { path = "../../crates/prism-ini" }

# Player / Android packaging: size priority (fat LTO + single codegen unit + abort + strip).
# Editor / tools run inside engine process, cannot use this profile.
# Size-priority tier: opt-level=z disables inlining and loop unrolling, for use with scripts/build-dist.sh --size
# (which also adds -C llvm-args=-inline-threshold=0, build-std and immediate-abort).
# For competition / extreme-size scenes; when hot path loses frames noticeably you can override key crates back to 3:
#   [profile.tiny.package.prism-engine]
#   opt-level = 3
[profile.tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Third-party dependencies don't need debuginfo in dev builds (saves tens of GB of target/).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
