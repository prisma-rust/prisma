[workspace]
resolver = "2"
members = [
    "crates/prism-ecs",
    "crates/prism-reflect",
    "crates/prism-reflect-derive",
    "crates/prism-gfx",
    "crates/prism-ini",
    "crates/prism-cooker",
    "crates/prism-scene",
    "crates/prism-render",
    "crates/prism-render-shaders",
    "crates/prism-ui-draw",
    "crates/prism-engine",
    "crates/prism-app",
    "crates/prism-game-api",
    "crates/prism-project-api",
    "crates/prism-runtime-host",
    "crates/prism-platform",
    "crates/prism-editor-api",
    "crates/prism-editor-mcp",
    "crates/prism-build-pipeline",
    "crates/prism-audio",
    "crates/prism-asset",
    "crates/prism-anim",
    "crates/prism-anim-ik",
    "crates/prism-anim-retarget",
    "crates/prism-motion-matching",
    "crates/prism-physics2d",
]
# xtask (Slang reflection -> Rust binding codegen) is a build-time tool run only
# on desktop/CI hosts that have slangc. Excluded so it never enters the default
# workspace build (keeps Termux/Android `cargo check` free of its deps).
exclude = ["crates/xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Vulkan
ash = "0.38"
ash-window = "0.13"
raw-window-handle = "0.6"

# Window / events
# Platform backend explicitly chosen by the consumer (see prism-platform's x11 / wayland feature):
# On Linux winit defaults to compiling both X11 + Wayland stacks (~1 MB),
# Windows/Android only have system libs/NDK, not affected.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "android-game-activity"] }

# Maths
glam = { version = "0.33.2", features = ["serde"] }
# POD reinterpretation for GPU uploads and push constants (#1036).
bytemuck = { version = "1", features = ["derive"] }

# Physics (Rapier)
rapier3d = { version = "0.34", default-features = false, features = ["dim3", "f32", "std"] }

# Inter-thread communication
flume = "0.12.0"

# Logging
log = "0.4"
# Default features (incl. `regex` log filtering, ~0.47 MB) must be explicitly enabled by the consumer:
# Player runtime doesn't need regex, build tools do. See docs/DESIGN.md §12.4.
env_logger = { version = "0.11", default-features = false }

# Error handling
anyhow = "1"

# Serialization / async / errors. These keys are shared with `prism-asset` and
# `prism-cooker` (members of this workspace); those crates declare the few they
# need locally (uuid, typetag, gltf, ...) and inherit the rest from here.
# Keep versions consistent if any are overridden in their Cargo.toml files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2.0.1", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zstd = { version = "0.13", features = ["experimental"] }
thiserror = "2.0.19"
proptest = "1"
clap = { version = "4", features = ["derive"] }
# Runtime image dependency must have **zero default codecs**: each crate only declares the formats it actually uses.
#   - Player runtime (prism-render screenshot): png
#   - Build time (prism-cooker import): all their own formats
# This way jpeg/tga/bmp/exr codecs won't be baked into the player binary.
image = { version = "0.25", default-features = false }
dirs = "6.0.0"
unicode-width = "0.2"
# UAX #14 line breaking opportunities (`prism-render/ui` UI text line breaking). Only this one dependency, doesn't pull
# textwrap: line break width uses font advance (pixels), not textwrap's column width.
unicode-linebreak = "0.1"

# Windows API bindings. Currently only `prism-render/ui-directwrite` (DirectWrite text rasterization) uses it,
# and only activated as optional dependency on `cfg(windows)` target (see prism-render/Cargo.toml).
windows = "0.62"

# Asset / scene loading
# `gltf` crate version is the crate's release stream (1.4 = current), not the
# glTF spec version - the crate loads glTF 2.0 regardless of its own version.
gltf = { version = "1.4", features = ["KHR_materials_transmission", "KHR_materials_emissive_strength", "KHR_materials_ior", "extensions"] }
slotmap = "1.0"
rayon = "1.10"
rand = "0.10.2"

[profile.dev]
opt-level = 1          # ash/Vulkan has a lot of codegen; light opt keeps debug builds usable
# This repo's crates keep line tables, enough to locate panics; full DWARF would bloat target/ and incremental to tens of GB.
debug = "line-tables-only"

# Dependents' debug info mostly unused, removing saves a lot; this repo's crates still keep line numbers.
[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"

# Player / Android packaging profile: size-optimized, **not for editor**.
# `panic = "abort"` would crash the entire editor running the engine in-process instead of just one viewport failing,
# so it's not in `release`, only in this profile. Usage: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.tiny]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
