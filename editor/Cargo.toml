[workspace]
resolver = "2"
members = ["crates/prism-editor-egui", "crates/prism-editor-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
ash = { version = "0.38", default-features = false }
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
egui = "0.33.3"
egui-winit = { version = "0.33.3", default-features = false, features = ["clipboard", "links"] }
egui-phosphor = { version = "0.11", default-features = true }
winit = "0.30"
env_logger = "0.11"
# Asset thumbnails (#982); `prism-editor-core` decodes PNG, the UI uploads it.
image = { version = "0.25", default-features = false }
glam = "0.33"
gpu-allocator = { version = "0.27", default-features = false, features = [
  "vulkan",
] }
log = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
