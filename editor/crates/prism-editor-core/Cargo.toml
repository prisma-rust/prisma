[package]
name = "prism-editor-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prisma editor data layer: dock layout tree, scene document, schema, undo stack, theme, log"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# Asset thumbnails (#982): decode only the formats the panel can preview.
image = { workspace = true, features = ["png"] }
glam = { workspace = true }
# `assets/settings.ini` dialect (shared parser with engine / editor-api).
prism-ini = { path = "../../../crates/prism-ini" }
