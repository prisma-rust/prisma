[package]
name = "prism-editor-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prisma egui editor: classic layout + Scene/Game viewport zero-copy"

[[bin]]
name = "prism-editor-egui"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
ash = { workspace = true }
ash-window = { workspace = true }
bytemuck = { workspace = true }
egui = { workspace = true }
egui-winit = { workspace = true }
egui-phosphor = { workspace = true }
winit = { workspace = true }
env_logger = { workspace = true }
glam = { workspace = true }
gpu-allocator = { workspace = true }
log = { workspace = true }
raw-window-handle = { workspace = true }
serde_json = { workspace = true }

prism-render = { path = "../../../crates/prism-render" }
prism-anim = { path = "../../../crates/prism-anim" }
prism-engine = { path = "../../../crates/prism-engine" }
# Project panel audio preview (#508): shares same decoder / mixer with player.
prism-audio = { path = "../../../crates/prism-audio" }
prism-scene = { path = "../../../crates/prism-scene" }
# Game View Play executes user project gameplay code: dynamic module host sharing build ABI.
prism-runtime-host = { path = "../../../crates/prism-runtime-host" }
# Data layer (UI-framework-agnostic): dock layout, document model, schema,
# undo stack, log buffer, i18n, project read/write.
prism-editor-core = { path = "../prism-editor-core" }
# Sole source of component schema: property panel schema projected from `prism-scene` reflection registry.
prism-editor-api = { path = "../../../crates/prism-editor-api" }
