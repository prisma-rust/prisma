[package]
name = "prism-asset"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime asset formats: AssetId/Handle, .pak package, ResourceManager, streaming"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { version = "1", features = ["v4"] }

typetag = { version = "0.2", optional = true }

tokio = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }

zstd = { workspace = true, optional = true }
xxhash-rust = { version = "0.8", features = ["xxh3"], optional = true }

[features]
default = ["runtime", "types", "streaming"]
asset-data = ["dep:typetag"]
core = []
# tokio only for `*_async` variants (runtime defaults to sync IO), default not into player binary.
async-io = ["dep:tokio"]
runtime = ["dep:tracing", "core", "package"]
package = ["core", "dep:zstd", "dep:xxhash-rust"]
# Compat alias: hot-reload poller now always compiles with `runtime`, opening this feature no longer has side effects.
hot-reload = ["runtime"]
streaming = ["runtime"]
types = ["core", "asset-data"]

[dev-dependencies]
tempfile = "3"
bincode = { workspace = true }
