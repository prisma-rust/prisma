[package]
name = "prism-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vulkan rendering backend for Prisma"

[features]
# ---- Modular building blocks: project templates select features (see docs/DESIGN.md §12) ----
# Default "full amount", library and example behavior unchanged; template project picks bricks as needed.
default = [
    "pathtrace",
    "sharc",
    "restir_gi",
    "prt",
    "anf",
    "ui",
    "ui-fontdue",
    "ibl",
    "skybox",
    "shadows",
    # "gtao",
]
# UI overlay master switch (glyph atlas + pipeline + screen-space quad). Pure 3D / no-UI projects can disable:
# after disabling `ui_overlay` only input data structures remain, render side ignores UI commands.
#
# It **does not** decide who rasterizes glyphs — that is the job of the two text backends below:
#   `ui-fontdue`     fontdue + ttf-parser (all platforms, default)
#   `ui-directwrite` Windows system DirectWrite (Windows only, drops fontdue/ttf-parser)
# Enabling only `ui` without a backend = only draws quads, no text (saves ~90 KB), warns once at launch.
ui = ["dep:unicode-linebreak"]
# Text backend A: fontdue rasterization + ttf-parser (~90 KB), all platforms.
ui-fontdue = ["ui", "dep:fontdue"]
# Text backend B: Windows system DirectWrite + GDI interop (`windows` bindings enabled only on Windows target).
# **Mutually exclusive** with `ui-fontdue` (enabling both keeps fontdue/ttf-parser in binary for nothing),
# enabling it on non-Windows target directly fails compilation (see compile_error! in ui_overlay.rs).
ui-directwrite = ["ui", "dep:windows"]
# Real-time path tracing (pt_pass.rs + acceleration structure). Pure raster projects can disable.
pathtrace = []
# ReSTIR GI for the raster path (restir_gi.rs + restir_gi.slang). Traces
# secondary rays from the GBuffer and reuses reservoirs in space + time, so the
# raster scene gets real-time indirect diffuse WITHOUT compiling the path tracer.
# Needs VK_KHR_ray_query at runtime; falls back to Off when unavailable.
restir_gi = []
# SHaRC (NVIDIA RTXGI v1.6): Spatially Hashed Radiance Cache.
# Does not depend on pathtrace: ReSTIR GI in raster mode also uses it as radiance cache endpoint (hit point queries cache,
# no further tracing). Disabling = ReSTIR GI only single bounce + skybox, PT also falls back to pure path tracing.
# See docs/DESIGN.md §12.2.
sharc = []
# PRT64 + 64-tree streaming GI pass (`prt_pass.rs` + `prt_*.comp.spv`).
prt = []
# NVIDIA Neural Radiance Cache (NRC)
nrc = ["pathtrace"]
# NVIDIA Streamline / DLSS (Super Resolution & Ray Reconstruction)
dlss = []
# NVIDIA DLSS Frame Generation (desktop only).
dlfg = ["dlss"]
# NVIDIA Real-Time Denoisers (NRD, desktop only).
nrd = []
# Qualcomm Adreno Neural Fusion (SR / Frame Gen, mobile Adreno only).
anf = []
# Image-based lighting (IBL): environment cubemap convolution / irradiance / prefilter / BRDF LUT + HDR decode.
# 2D or flat-color scenes can disable, `IblResources` degrades to 1x1 neutral gray (descriptor layout unchanged).
ibl = []
# Skybox pass (skybox.vert/frag.spv + pipeline). Depends on `ibl`: without environment cubemap there is
# no background to draw. After disabling `SkyboxPass` degrades to empty impl, `ForwardPass` call sites unchanged.
skybox = ["ibl"]
# Shadow map pass (shadow_map_pass.rs). After disabling set 3 binds 1x1 far-depth dummy,
# scene has no real-time shadow (descriptor layout unchanged, validation layer clean).
shadows = []
# GTAO (half-resolution ambient occlusion, gtao.rs). After disabling set 4 binds 1x1 white dummy.
gtao = []

[dependencies]
prism-gfx = { path = "../prism-gfx" }
prism-render-shaders = { path = "../prism-render-shaders" }
# The UI draw packet is pure data, so producers in any layer can build it
# without depending on the renderer.
prism-ui-draw = { path = "../prism-ui-draw" }
ash = { workspace = true }
ash-window = { workspace = true }
raw-window-handle = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
slotmap = { workspace = true }
glam = { workspace = true }
# Only need PNG encode (screenshot + nearest-neighbor scale). RGBe/HDR decode is implemented
# by `hdr.rs::load_rgbe` itself, does not depend on image `hdr` feature.
image = { workspace = true, features = ["png"] }
# UAX #14 break opportunities for `Text.wrap` (pixel advances, not column widths).
unicode-linebreak = { workspace = true, optional = true }
fontdue = { version = "0.9", optional = true }

# Text backend B (`ui-directwrite`): only Win32 DirectWrite + GDI subset.
# Optional + enabled only on windows target, so Linux/Android dependency graph never includes it.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Gdi",
] }

[[test]]
# Streamline smoke test needs the `dlss` brick: it probes the runtime and drives
# `DlssMode` through the graph. Without the feature those symbols do not exist.
name = "streamline_gpu"
required-features = ["dlss"]

[dev-dependencies]
bytemuck = { workspace = true }
gltf = { workspace = true }
