[package]
name = "prism-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application layer and main loop for Prisma"

[features]
default = ["pathtrace", "sharc", "prt", "anf", "ui", "ui-fontdue", "ibl", "skybox", "shadows", "gtao", "group-3d", "group-2d", "group-ui"]
legacy-disk-scenes = []
# Modular building-block toggles: forwarded to prism-render (see docs/DESIGN.md §12).
pathtrace = ["prism-render/pathtrace"]
sharc = ["prism-render/sharc"]
restir_gi = ["prism-render/restir_gi"]
prt = ["prism-render/prt"]
nrc = ["prism-render/nrc", "pathtrace"]
dlss = ["prism-render/dlss"]
dlfg = ["prism-render/dlfg", "dlss"]
nrd = ["prism-render/nrd"]
anf = ["prism-render/anf"]
# Debug layer flag (pass-through): engine itself only uses it for compile-time description of `RenderSettings` debug fields,
# the real consumer is `prism-app` (F3 HUD / debug graph / debug shortcuts). Default off, see prism-app.
engine-debug = []
ui = ["prism-render/ui"]
# Text rasterizer backend (pass-through): default fontdue; Windows optionally uses system DirectWrite.
ui-fontdue = ["prism-render/ui-fontdue"]
ui-directwrite = ["prism-render/ui-directwrite"]
ibl = ["prism-render/ibl"]
skybox = ["prism-render/skybox"]
shadows = ["prism-render/shadows"]
gtao = ["prism-render/gtao"]
# Component groups (pass-through prism-scene): disabling a group = group components not registered, serde code not linked.
group-3d = ["prism-scene/group-3d"]
group-2d = ["prism-scene/group-2d"]
group-ui = ["prism-scene/group-ui"]
# ECS audio integration (`AudioSource` + `sync_audio_sources`). Default off: entire cpal /
# firewheel / symphonia chain (~30 crates) only enabled in projects needing sound.
audio = ["dep:prism-audio"]

[dependencies]
prism-ecs = { path = "../prism-ecs" }
# ABI snapshot type (`InputSnapshot`). Pure data crate, no deps; engine writes it into
# World resource each frame, static Player `GameWorld::input()` therefore has real input (#589).
prism-project-api = { path = "../prism-project-api" }
prism-reflect = { path = "../prism-reflect" }
# settings.ini dialect: engine / editor-api / editor-core share one parser.
prism-ini = { path = "../prism-ini" }
# Must use default-features = false: otherwise component group switches get re-enabled by prism-scene default features.
prism-scene = { path = "../prism-scene", default-features = false }
prism-render = { path = "../prism-render", default-features = false }
# The engine builds UI draw packets directly, without naming the renderer.
prism-ui-draw = { path = "../prism-ui-draw" }
prism-asset = { path = "../prism-asset", default-features = false, features = ["runtime"] }
prism-anim = { path = "../prism-anim" }
prism-anim-ik = { path = "../prism-anim-ik" }
prism-physics2d = { path = "../prism-physics2d" }

prism-audio = { path = "../prism-audio", optional = true }
glam.workspace = true
bytemuck = { workspace = true }
log = { workspace = true }
anyhow = { workspace = true }
rustc-hash = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
