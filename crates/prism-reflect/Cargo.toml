[package]
name = "prism-reflect"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runtime reflection (TypeDesc/Value/Registry) and self-describing RTTIBin"

[dependencies]
prism-reflect-derive = { path = "../prism-reflect-derive", optional = true }
glam = { workspace = true, optional = true }

[features]
default = ["derive", "glam"]
derive = ["dep:prism-reflect-derive"]
glam = ["dep:glam"]

[dev-dependencies]
prism-reflect-derive = { path = "../prism-reflect-derive" }
glam = { workspace = true }
proptest = { workspace = true }
