[package]
name = "prism-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform application layer — owns the event loop, window, and frame orchestration"

[lib]
# rlib for desktop linking; Android `android_main` JNI entry lives in the
# user project's cdylib (see `run_android_app`), not here.
crate-type = ["lib"]

[features]
# Physics is **optional** capability. `physics_runner` is still skeleton (independent thread + step/result channel),
# not yet wired into `Engine::update`; do not let it default pull rapier3d / parry3d into player binary.
# Need physics enable in user project: `prism-app = { path = "...", features = ["physics"] }`.
default = ["pathtrace", "sharc", "prt", "anf", "ui", "ui-fontdue", "ibl", "skybox", "shadows", "gtao", "winit-backend", "x11", "wayland", "group-3d", "group-2d", "group-ui"]
# Window backend choose one of two:
# - `winit-backend` (default): winit window + event loop (desktop / Android).
# - `win32-native` (default off, Windows only): Win32 native window, **does not compile any winit code**,
#   Windows release package thus saves winit size. Enable it please turn off `winit-backend`.
# Both on then winit takes precedence (`win32-native` ignored), convenient for debugging mix.
winit-backend = ["dep:winit", "prism-platform/winit-backend"]
win32-native = ["prism-platform/win32-native"]
# Linux winit sub-backend (passed through prism-platform): when size sensitive keep only one.
# They **imply** `winit-backend`: `--no-default-features --features x11` still is
# the only legal combo "winit + X11 only" (`scripts/check_features.py` depends on this).
x11 = ["winit-backend", "prism-platform/x11"]
wayland = ["winit-backend", "prism-platform/wayland"]
# Modular building-block toggles: forwarded to prism-render / prism-engine (see docs/DESIGN.md §12).
pathtrace = ["prism-render/pathtrace", "prism-engine/pathtrace"]
sharc = ["prism-render/sharc", "prism-engine/sharc"]
restir_gi = ["prism-render/restir_gi", "prism-engine/restir_gi"]
prt = ["prism-render/prt", "prism-engine/prt"]
nrc = ["prism-render/nrc", "prism-engine/nrc", "pathtrace"]
dlss = ["prism-render/dlss", "prism-engine/dlss"]
dlfg = ["prism-render/dlfg", "prism-engine/dlfg", "dlss"]
nrd = ["prism-render/nrd", "prism-engine/nrd"]
anf = ["prism-render/anf", "prism-engine/anf"]
ui = ["prism-render/ui", "prism-engine/ui"]
# Text raster backend (passed through to prism-render, see docs/DESIGN.md §12.2). Default fontdue;
# Windows release package can just use system DirectWrite (`ui-directwrite`), saving fontdue/ttf-parser.
ui-fontdue = ["prism-render/ui-fontdue"]
ui-directwrite = ["prism-render/ui-directwrite"]
ibl = ["prism-render/ibl", "prism-engine/ibl"]
skybox = ["prism-render/skybox", "prism-engine/skybox"]
shadows = ["prism-render/shadows", "prism-engine/shadows"]
gtao = ["prism-render/gtao", "prism-engine/gtao"]
group-3d = ["prism-engine/group-3d"]
group-2d = ["prism-engine/group-2d"]
group-ui = ["prism-engine/group-ui"]
# Engine debug layer (F3 HUD / Tab debug graph / T tonemap / PBR key isolation). **Default off**:
# It is host-level debug UI and several global hotkeys, belongs to "who uses who turns on" capability, should not be stuffed into every game.
# Editor and `projects/template` turn it on; game projects (e.g. Sponza) use own panels, keep off,
# these keys all left to project itself.
engine-debug = ["prism-engine/engine-debug"]
physics = ["dep:rapier3d"]
# Audio backend (cpal + firewheel + symphonia, ~60 crates). Default off: repo has no
# place actually playing sound (`Subsystem::Audio` only builds engine + decode thread). Need sound project
# open this one switch, it will also enable `prism-engine/audio` (ECS side `AudioSource`).
audio = ["dep:prism-audio", "prism-engine/audio"]

[dependencies]
prism-engine = { path = "../prism-engine", default-features = false }
# `add_game_system` hands gameplay code the same `GameWorld` the preview module uses.
# `plugin` is not needed here: the player borrows the world directly.
prism-game-api = { path = "../prism-game-api", default-features = false, features = ["host"] }
prism-render = { path = "../prism-render", default-features = false }
# The debug HUD appends text commands to the UI packet; it needs the packet
# types, not the renderer.
prism-ui-draw = { path = "../prism-ui-draw" }
prism-platform = { path = "../prism-platform", default-features = false }
prism-audio = { path = "../prism-audio", optional = true }
prism-asset = { path = "../prism-asset", default-features = false, features = ["core", "runtime"] }
glam.workspace = true
rapier3d = { workspace = true, optional = true }
flume.workspace = true

winit = { workspace = true, optional = true }
# Neutral raw window handle (winit `raw_window_handle` re-export is this crate itself).
# Directly depend on it, `win32-native` build will not pull winit because of `use winit::raw_window_handle`.
raw-window-handle = { workspace = true }
log = { workspace = true }
# `regex` only used for RUST_LOG regex filtering (`env_filter` `regex` feature),
# default on a whole regex engine (regex-automata + regex-syntax + aho-corasick ≈ 0.47 MB).
# We only use `module=level` type directives, substring match sufficient; need regex project turn on default feature itself.
env_logger = { workspace = true, default-features = false, features = ["auto-color", "humantime"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "android")'.dependencies]
# Default feature `regex` only for RUST_LOG regex filtering; Android it also pulls whole regex engine.
android_logger = { version = "0.15", default-features = false }
ndk = "0.9"
jni = "0.22"
android-activity = { version = "0.6", features = ["game-activity"] }

[dev-dependencies]
# `examples/hosted_png.rs` only writes PNG.
image = { workspace = true, features = ["png"] }
jni = "0.22"
