[package]
name = "prism-game-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine-independent gameplay API shared by the runtime host and project modules"

# Both backends share the same set of function signatures:
# - `host`: directly borrow host's own ECS World, zero serialization (static Player / in-host).
# - `plugin`: read/write through C function table provided by host, components cross boundary as RTTIBin byte streams.
# Plugin build only needs `--no-default-features --features plugin`.
[features]
default = ["host", "plugin"]
host = ["dep:prism-engine", "dep:prism-ui-draw"]
plugin = []

[dependencies]
prism-reflect = { path = "../prism-reflect" }
prism-project-api = { path = "../prism-project-api" }
# Pure data ECS (no Vulkan / no UI). Plugin side only uses its `Entity` handle layout and
# `Component` blanket impl, never passing host `World` pointer out.
prism-ecs = { path = "../prism-ecs" }
# `find_by_name` needs the `Name` schema component. `prism-scene` is pure data
# (no engine, render or UI), so it stays inside the plugin boundary rules.
prism-scene = { path = "../prism-scene" }
prism-physics2d = { path = "../prism-physics2d" }
# Only `host` backend used for loose asset location (plugin build will not pull in engine).
# **Must use default-features = false**: otherwise prism-engine defaults (such as `pathtrace`)
# are forced onto every player, breaking project template building-block toggles (#535 verified).
prism-engine = { path = "../prism-engine", optional = true, default-features = false }
# The draw packet a project module pushes through `draw_quad`; the host backend
# queues it into the engine's `ExternalUiQuads` resource.
prism-ui-draw = { path = "../prism-ui-draw", optional = true }
log.workspace = true

[dev-dependencies]
# Validate plugin backend with a real host function table, not a fake one in test.
prism-runtime-host = { path = "../prism-runtime-host" }
prism-scene = { path = "../prism-scene" }
# Test builds world matrix (`LocalToWorld`), same workspace dependency as prism-scene.
glam.workspace = true
