name: CI

# Full-coverage build/verify pipeline for Prisma:
#   - fmt + clippy (fast gate)
#   - desktop Rust build + test (prism-ecs / prism-render / prism-engine / prism-platform)
#   - xtask build + shader-binding codegen regression (no-drift check)
#   - Slang shader compile (.slang -> .spv + reflection JSON) via slangc
#
# Design notes:
#   * Jobs run in parallel: `lint` is a merge gate, not a prerequisite. It only
#     takes ~1m of setup (toolchain, apt, slang) and ~10s of actual linting, so
#     making builds wait for it added a minute to every run.
#   * slangc and the compiled .spv/reflection are cached for lint/desktop with
#     an exact source hash. The shaders job always recompiles so the binding
#     drift check never reads a stale cache.
#   * prism-app depends on android-activity, which only compiles for the
#     aarch64-linux-android target — it is EXCLUDED from the desktop job and
#     built on-device / via the Tauri launcher instead.
#   * xtask is a workspace-excluded build tool; it is built/run from its own dir.
#   * slangc is a glibc binary (no Termux); CI runs it on ubuntu-latest.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Bump to force-refresh caches when toolchains change.
  CACHE_VERSION: v1
  # Slang release used to compile shaders (both desktop + shaders jobs).
  SLANG_VERSION: "2026.21"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 0. Doc-only fast path. The three jobs below are required status checks on
  #    `master`; a job skipped by `if` reports "Success", so doc-only PRs stay
  #    mergeable. (Skipping the whole workflow with `paths-ignore` would leave
  #    those checks "Expected" and block the merge.)
  # ---------------------------------------------------------------------------
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      shaders: ${{ steps.filter.outputs.shaders }}
      features: ${{ steps.filter.outputs.features }}
      user_projects: ${{ steps.filter.outputs.user_projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -u
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          # First push / manual dispatch: nothing to compare against → full CI.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "shaders=true" >> "$GITHUB_OUTPUT"
            echo "features=true" >> "$GITHUB_OUTPUT"
            echo "user_projects=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff can't prove the change is doc-only → fail closed, full CI.
          if ! diff_out=$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null); then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "shaders=true" >> "$GITHUB_OUTPUT"
            echo "features=true" >> "$GITHUB_OUTPUT"
            echo "user_projects=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$diff_out" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "shaders=false" >> "$GITHUB_OUTPUT"
            echo "features=false" >> "$GITHUB_OUTPUT"
            echo "user_projects=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          non_doc=$(printf '%s\n' "$diff_out" \
            | grep -Ev '^(docs/|.*\.md$|LICENSE.*|\.gitignore$)' || true)
          if [ -z "$non_doc" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "shaders=false" >> "$GITHUB_OUTPUT"
            echo "features=false" >> "$GITHUB_OUTPUT"
            echo "user_projects=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Pure Rust comment-only changes skip heavy build/test jobs just like doc-only PRs.
          if ! printf '%s\n' "$non_doc" | grep -qvE '\.rs$' \
            && python3 scripts/check_comment_only.py --base "$base"; then
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "shaders=false" >> "$GITHUB_OUTPUT"
            echo "features=false" >> "$GITHUB_OUTPUT"
            echo "user_projects=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "code=true" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "shaders=true" >> "$GITHUB_OUTPUT"
            echo "features=true" >> "$GITHUB_OUTPUT"
            echo "user_projects=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$non_doc" | grep -qE '^(assets/shaders/|crates/xtask/)'; then
            echo "shaders=true" >> "$GITHUB_OUTPUT"
          else
            echo "shaders=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$non_doc" | grep -qE '(^Cargo\.toml$|/Cargo\.toml$|^scripts/check_features\.py$)'; then
            echo "features=true" >> "$GITHUB_OUTPUT"
          else
            echo "features=false" >> "$GITHUB_OUTPUT"
          fi
          if printf '%s\n' "$non_doc" | grep -qE '^(crates/prism-(app|engine|scene|asset|render)/|projects/|Cargo\.toml$|Cargo\.lock$)'; then
            echo "user_projects=true" >> "$GITHUB_OUTPUT"
          else
            echo "user_projects=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 0b. Player dependency budget: `prism-app` is the single top-level player
  #     dependency; resolution only (no compile or .spv needed).
  # ---------------------------------------------------------------------------
  deps:
    name: player dependency budget
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Check player dependency tree
        run: python3 scripts/check_deps.py

  # ---------------------------------------------------------------------------
  # 0c. Modular feature matrix: verify disabled subsystems still compile.
  # ---------------------------------------------------------------------------
  features:
    name: modular feature matrix
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.features == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-features

      # Compiled .spv and reflection JSON are committed (verified by the shaders job).
      - name: Feature matrix
        run: python3 scripts/check_features.py

      # Cross-check Windows-only DirectWrite/fontdue text backends (no linker needed).
      - name: Windows text backends (cross check)
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo check -p prism-render --target x86_64-pc-windows-gnu \
            --no-default-features --features ui,ui-directwrite
          cargo check -p prism-render --target x86_64-pc-windows-gnu \
            --no-default-features --features ui,ui-fontdue

  # ---------------------------------------------------------------------------
  # 1. Lint gate.
  # ---------------------------------------------------------------------------
  lint:
    name: fmt + clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ALSA headers (for prism-audio)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-lint

      - name: rustfmt --check
        run: cargo fmt --all -- --check

      - name: comment style (changed lines)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ]; then
            python3 scripts/check_comments.py --changed --base "$base" --added-lines
          fi

      # The root Cargo.toml is the only version source; standalone workspaces
      # cannot inherit it, so drift is checked here instead of at release time.
      - name: version consistency
        run: python3 scripts/version.py check

      # Desktop crates only (prism-app needs the NDK target for Android).
      - name: clippy (desktop crates)
        run: >
          cargo clippy
          -p prism-ecs -p prism-gfx -p prism-render -p prism-engine -p prism-platform
          --all-targets -- -D warnings

      # xtask is workspace-excluded, so --all/-p don't reach it. Check it here.
      - name: fmt + clippy (xtask)
        working-directory: crates/xtask
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings

      # Verify `derive` / `glam` remain genuinely optional features.
      - name: check prism-reflect without default features
        run: cargo check -p prism-reflect --no-default-features

  # ---------------------------------------------------------------------------
  # 3c. Release binary size: nightly `-Z build-std` + immediate-abort (tags / manual dispatch).
  # ---------------------------------------------------------------------------
  dist-size:
    name: dist build (nightly build-std)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + rust-src
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly

      - name: Build release player (build-std)
        run: bash scripts/build-dist.sh projects/template

      - name: Record size
        run: |
          bin="projects/template/target/$(rustc -vV | sed -n 's/^host: //p')/dist/template"
          printf 'dist player: %s bytes\n' "$(stat -c%s "$bin")"

      - name: Upload player
        uses: actions/upload-artifact@v4
        with:
          name: template-dist-${{ github.sha }}
          path: projects/template/target/*/dist/template
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2. Desktop build + test. The core correctness gate we can fully run in CI.
  # ---------------------------------------------------------------------------
  desktop:
    name: desktop build + test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # ash links against the Vulkan loader at build time only for examples that
      # create a device; the lib itself is loader-agnostic. Install the loader +
      # headers so any test that touches vk symbols links cleanly.
      - name: Install Vulkan loader + headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-desktop

      - name: Build (desktop crates)
        run: >
          cargo build --locked
          -p prism-ecs -p prism-gfx -p prism-render -p prism-engine -p prism-platform

      # Every GPU integration test creates its own `VkInstance` / `VkDevice`
      # inside the test binary. On lavapipe, letting several of them initialise
      # at once intermittently SIGSEGVs at process start, with no Rust stack to
      # debug (#847). Run `prism-render` tests one at a time inside each binary;
      # Cargo already runs the binaries sequentially, so the other crates keep
      # their normal parallelism.
      - name: Test (desktop crates)
        env:
          PRISM_REQUIRE_VALIDATION: "1"
        run: >
          cargo test --locked
          -p prism-ecs -p prism-gfx -p prism-engine -p prism-platform

      - name: Test (prism-render, serialized GPU tests)
        env:
          # Exclude preinstalled llvmpipe software ICD on GPU-less ubuntu-latest runners.
          VK_ICD_FILENAMES: /nonexistent
          VK_DRIVER_FILES: /nonexistent
        run: >
          cargo test --locked -p prism-render -- --test-threads=1

      - name: Upload golden-frame mismatch artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-frame-artifacts
          path: target/golden-frames/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 3. User projects (`projects/*` are standalone workspaces outside root Cargo build).
  # ---------------------------------------------------------------------------
  user-projects:
    name: user projects build
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.user_projects == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Projects link `prism-app` (default `audio` feature), requiring ALSA headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev libasound2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_VERSION }}-projects

      # `--locked`: keep standalone project Cargo.lock files in sync with engine changes.
      - name: Build every project workspace
        run: |
          for manifest in projects/*/Cargo.toml; do
            echo "::group::${manifest}"
            cargo build --locked --manifest-path "${manifest}"
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # 4. Slang shaders: compile to SPIR-V + reflection, then verify the committed
  #    Rust bindings match freshly-generated ones (drift guard).
  # ---------------------------------------------------------------------------
  shaders:
    name: slang compile + binding drift
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.shaders == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
            key: ${{ env.CACHE_VERSION }}-shaders

      - name: Setup slang + compile shaders
        uses: ./.github/actions/setup-slang
        with:
          cache_shaders: "false"

      - name: slangc version
        run: "$SLANGC -v"

      # Always upload the freshly compiled SPIR-V + reflection JSON (survives
      # even if the drift check below fails), so the artifacts can be committed
      # to the repo for hosts without slangc.
      - name: Upload compiled SPIR-V + reflection (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spirv
          path: |
            assets/shaders/*.spv
            assets/shaders/reflection/*.json
          if-no-files-found: warn

      # Debug artifact: always upload the real slangc-produced reflection JSON
      # so the actual schema can be inspected (e.g. when the xtask parser needs
      # recalibration). Survives even if the drift check below fails.
      - name: Upload real reflection JSON (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slang-reflection-real
          path: assets/shaders/reflection/*.json
          if-no-files-found: warn

      - name: Regenerate Rust shader bindings from fresh reflection
        run: |
          cd crates/xtask
          cargo run --locked --bin shader-bindgen -- \
            ../../assets/shaders/reflection ../../crates/prism-render/src/shader_bindings

      - name: Fail if committed bindings drift from source
        run: |
          # The generated Rust bindings are committed and MUST match what
          # bindgen produces from the freshly compiled reflection JSON. Any
          # drift means someone edited a shader without regenerating — fail.
          # (the committed .spv files are checked in the next step.)
          drift=0
          if ! git diff --quiet -- crates/prism-render/src/shader_bindings/; then
            echo "::error::shader_bindings/ is out of date. Run assets/shaders/compile.sh + xtask and commit."
            git diff -- crates/prism-render/src/shader_bindings/
            drift=1
          fi
          if [ "$drift" -ne 0 ]; then exit 1; fi
          echo "Shader bindings are up to date."

      - name: Fail if committed SPIR-V drifts from source
        run: |
          # `assets/shaders/*.spv` is committed so a clone builds without
          # slangc. This job just recompiled every shader, so a changed or
          # untracked .spv means someone edited a `.slang` without committing
          # the new bytecode (or bumped slangc).
          changed=$(git status --porcelain -- assets/shaders)
          if [ -n "$changed" ]; then
            echo "::error::assets/shaders is out of date. Run assets/shaders/compile.sh and commit the .spv files."
            printf '%s\n' "$changed"
            exit 1
          fi
          echo "Committed SPIR-V matches the sources."
