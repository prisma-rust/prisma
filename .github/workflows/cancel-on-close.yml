name: cancel-on-close

# Cancel queued/running checks immediately when a PR is closed or merged.
# Requires pull_request_target so fork PR runs can be cancelled without checking out PR code.

on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the pull request's unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for status in queued in_progress waiting pending requested; do
            gh run list -R "$REPO" --branch "$BRANCH" --status "$status" --limit 100 \
              --json databaseId,event,headSha \
              -q ".[] | select(.event == \"pull_request\" and .headSha == \"$SHA\") | .databaseId"
          done | sort -u | while read -r id; do
            gh run cancel -R "$REPO" "$id" || true
          done
