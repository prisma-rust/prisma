name: PR triage

# Mechanical PR triage:
#   - Validate title against Conventional Commits (scripts/check_commit_msg.py)
#   - Require HEAD-bound pr_ready self-check block (**Result: + HEAD: <sha>)
#   - Apply area/*, size/*, and ai labels
#
# Uses pull_request_target on base commit only; never executes PR code or
# interpolates untrusted title/body strings into shell commands.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Ensure labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: sh tools/ci/ensure_labels.sh

      - name: Title, self-check, labels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          comment_once() {
            local marker=$1 message=$2 existing
            existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' 2>/dev/null || true)
            if ! printf '%s' "$existing" | grep -qF "$marker"; then
              printf '%s\n%s\n' "$marker" "$message" | gh pr comment "$PR" --body-file -
            fi
          }

          # Title
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title"
          if python scripts/check_commit_msg.py "$RUNNER_TEMP/pr-title" 2>"$RUNNER_TEMP/title.err"; then
            gh pr edit "$PR" --remove-label needs/title >/dev/null 2>&1 || true
          else
            title_err=$(tr '\n' ' ' < "$RUNNER_TEMP/title.err" | sed 's/[[:space:]]*$//')
            gh pr edit "$PR" --add-label needs/title
            comment_once "<!-- pr-triage:title -->" \
          "PR title failed check (${title_err:-check failed}). Expected \`<type>(<scope>): <imperative summary>\` (<= 72 chars); see \`docs/ai-workflow.md\`."
          fi

          # Self-check block: require **Result: and HEAD: `<sha>` matching current head SHA.
          block_sha=$(printf '%s\n' "$BODY" | sed -nE 's/.*HEAD:[[:space:]]*`([0-9a-f]{7,40})`.*/\1/p' | head -n1 || true)
          if printf '%s' "$BODY" | grep -qE '^\*\*Result:' && [ -n "$block_sha" ] && [[ "$HEAD_SHA" == "$block_sha"* ]]; then
            gh pr edit "$PR" --remove-label needs/self-check >/dev/null 2>&1 || true
          elif printf '%s' "$BODY" | grep -qE '^\*\*Result:'; then
            gh pr edit "$PR" --add-label needs/self-check
            comment_once "<!-- pr-triage:self-check-head -->" \
          "Self-check block does not match current HEAD. Re-run \`python scripts/pr_ready.py\` on the latest commit and paste the full Markdown block (with \`HEAD:\`)."
          else
            gh pr edit "$PR" --add-label needs/self-check
            comment_once "<!-- pr-triage:self-check -->" \
          "Missing \`python scripts/pr_ready.py\` self-check block (must include \`**Result:\` and \`HEAD:\`)."
          fi

          # Area labels: clear old labels before applying current ones.
          for label in area/render area/scene area/editor area/engine area/assets \
                       area/game area/android area/ci area/docs; do
            gh pr edit "$PR" --remove-label "$label" >/dev/null 2>&1 || true
          done

          labels=""
          add() {
            case " $labels " in
              *" $1 "*) ;;
              *) labels="$labels $1" ;;
            esac
          }
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              crates/prism-render/*|assets/shaders/*) add area/render ;;
              crates/prism-scene/*|crates/prism-reflect/*|crates/prism-reflect-derive/*) add area/scene ;;
              crates/prism-editor-api/*|editor/*) add area/editor ;;
              crates/prism-engine/*|crates/prism-app/*|crates/prism-platform/*|crates/prism-audio/*) add area/engine ;;
              crates/prism-asset/*|crates/prism-cooker/*|crates/prism-build-pipeline/*|crates/prism-editor-tool/*) add area/assets ;;
              projects/*) add area/game ;;
              launcher/*|scripts/build-android.ps1|*android*) add area/android ;;
              .github/*|scripts/*|tools/*|crates/xtask/*) add area/ci ;;
              docs/*|*.md) add area/docs ;;
            esac
          done < <(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if [ -n "$labels" ]; then
            gh pr edit "$PR" --add-label "$(printf '%s' "${labels# }" | tr ' ' ',')"
          fi

          # Size labels
          for label in size/s size/m size/l; do
            gh pr edit "$PR" --remove-label "$label" >/dev/null 2>&1 || true
          done
          total=$(gh pr view "$PR" --json additions,deletions --jq '.additions + .deletions')
          if [ "$total" -lt 100 ]; then
            gh pr edit "$PR" --add-label size/s
          elif [ "$total" -lt 500 ]; then
            gh pr edit "$PR" --add-label size/m
          else
            gh pr edit "$PR" --add-label size/l
          fi

          # AI participation
          if printf '%s' "$BODY" | grep -qE '^> 🤖|🤖 by|Co-Authored-By:'; then
            gh pr edit "$PR" --add-label ai
          else
            gh pr edit "$PR" --remove-label ai >/dev/null 2>&1 || true
          fi
