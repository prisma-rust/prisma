name: Feature request
description: Propose a capability, workflow, or quality-of-life change
title: "[feature] "
labels: ["needs/triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is painful or missing today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How should it work? Any reference implementations?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / Trade-offs
      description: Is there a smaller scope? Which crates or layers are affected?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - render
        - scene / reflect
        - editor
        - engine / app / platform
        - asset / cooker / pipeline
        - Android / launcher
        - CI / tooling
        - docs
        - Unsure
