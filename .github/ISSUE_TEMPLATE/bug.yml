name: Bug report
description: Something is broken or renders incorrectly
title: "[bug] "
labels: ["needs/triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please provide minimal reproduction steps and logs.
        **Do not paste tokens, secrets, or local sensitive paths.** Report security issues via Security -> Report a vulnerability.

  - type: textarea
    id: summary
    attributes:
      label: Observed / Expected
      description: What happened vs. what you expected?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - Android
        - Termux
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      placeholder: "e.g. master@141aa6a or v0.1.0"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: "RUST_LOG=info output, Vulkan validation errors, or frame captures"
      render: shell

  - type: input
    id: gpu
    attributes:
      label: GPU / Driver (for rendering issues)
      placeholder: "e.g. RTX 4070 / NVIDIA 580.xx, or Adreno 740"
